name: Build static site for Hostinger

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_SITE_URL: https://microscopia.icibina.com.br
      NEXT_PUBLIC_HOTMART_CHECKOUT_URL: https://pay.hotmart.com/S106758446S

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:netlify

      - name: Publish generated files to deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch out/.nojekyll
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b hostinger-deploy
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-deploy
